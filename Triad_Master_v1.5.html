<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주요 3화음 반주 건반</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════
   기본 리셋 & 바디
═══════════════════════════════════════ */
* { margin:0; padding:0; box-sizing:border-box;
    user-select:none; -webkit-tap-highlight-color:transparent; }

body {
  font-family: 'Noto Sans KR', sans-serif;
  background: linear-gradient(160deg, #1e4a7a 0%, #2a6090 60%, #163858 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 28px 16px 50px;
  color: #fff;
}

h1 {
  font-size: clamp(21px, 3.3vw, 32px);
  font-weight: 900;
  letter-spacing: 3px;
  color: #e8d8b4;
  margin-bottom: 20px;
  text-shadow: 0 2px 12px rgba(0,0,0,0.6);
  text-align: center;
}

/* ═══════════════════════════════════════
   화음 버튼 영역
═══════════════════════════════════════ */
.chord-controls {
  display: flex;
  gap: 12px;
  margin-bottom: 18px;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
}

.chord-box {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  padding: 10px 16px;
  border-radius: 14px;
  background: rgba(255,255,255,0.12);
  border: 2px solid rgba(255,255,255,0.35);
}

.chord-btn {
  padding: 11px 20px;
  border-radius: 9px;
  border: 2px solid rgba(255,255,255,0.45);
  color: #fff;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: box-shadow 0.15s, border-color 0.15s, filter 0.15s;
  white-space: nowrap;
  text-shadow: 0 1px 3px rgba(0,0,0,0.35);
}
.chord-btn-1 { background: #1a5fd8; --glow: rgba(90,160,255,0.9); }
.chord-btn-4 { background: #0f8f44; --glow: rgba(90,230,140,0.9); }
.chord-btn-5 { background: #d02626; --glow: rgba(255,120,120,0.9); }
.chord-btn:hover  { filter: brightness(1.12); }
.chord-btn:active { transform: translateY(2px); filter: brightness(0.88); }
.chord-btn.active {
  border-color: #fff;
  box-shadow: 0 0 18px var(--glow), inset 0 1px 0 rgba(255,255,255,0.35);
}

/* 초기화 버튼: 연한 하늘/라벤더 파스텔 */
.reset-btn {
  padding: 11px 30px;
  border-radius: 9px;
  border: 1.5px solid rgba(255,160,210,0.80);
  background: rgba(210,60,140,0.55);
  color: #ffe8f4;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  text-shadow: 0 1px 3px rgba(0,0,0,0.25);
}
.reset-btn:hover  { background: rgba(210,60,140,0.78); color:#fff; }
.reset-btn:active { transform: translateY(2px); }

/* ═══════════════════════════════════════
   피아노 프레임
═══════════════════════════════════════ */
.piano-frame {
  background: linear-gradient(180deg,
    #D62828 0%, #b82020 35%, #c42424 65%, #8a1515 100%);
  border-radius: 16px;
  padding: 14px 16px 16px;
  box-shadow:
    inset 0 2px 8px rgba(255,120,120,0.18),
    0 16px 52px rgba(0,0,0,0.70);
  border: 2px solid #e03535;
  display: inline-block;
  max-width: 100%;
}

/* ═══════════════════════════════════════
   LCD (두 패널: 왼쪽 텍스트 + 오른쪽 오선지)
═══════════════════════════════════════ */
.piano-lcd {
  display: flex;
  flex-direction: row;
  gap: 10px;
  margin-bottom: 12px;
  width: 100%;
  align-items: stretch;
}
/* 왼쪽 안내 LCD */
.lcd-text {
  flex: 1;
  background: linear-gradient(180deg,
    #f5efe0 0%, #fdf6e8 50%, #f0e8d4 100%);
  border: 3px solid #c8a870;
  border-radius: 8px;
  padding: 8px 16px;
  min-height: 91px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: inset 0 2px 7px rgba(160,120,60,0.15);
}
/* 오른쪽 오선지 LCD */
.lcd-keysig {
  width: 146px;
  height: 91px;
  background: linear-gradient(180deg,
    #f5efe0 0%, #fdf6e8 50%, #f0e8d4 100%);
  border: 3px solid #c8a870;
  border-radius: 8px;
  box-shadow: inset 0 2px 7px rgba(160,120,60,0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  flex-shrink: 0;
}
.lcd-keysig img {
  width: 140px;
  height: 85px;
  display: block;
  flex-shrink: 0;
}
.lcd-line1 {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: clamp(14px, 2.3vw, 23px);
  font-weight: 900;
  color: #3a2000;
  text-align: center;
  line-height: 1.3;
}
.lcd-line2 {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: clamp(13px, 2.0vw, 22px);
  font-weight: 700;
  color: #5a3810;
  text-align: center;
  line-height: 1.3;
}

/* ═══════════════════════════════════════
   건반 영역
═══════════════════════════════════════ */
.piano-key-area {
  background: #0e0e0e;
  border-radius: 6px;
  padding: 8px 6px 8px 6px;
  box-shadow: inset 0 4px 10px rgba(0,0,0,0.78);
  overflow-x: auto;
  max-width: 100%;
  /* 모바일에서 스크롤바 영역 확보 */
  scrollbar-width: auto;
  scrollbar-color: #888 #2a2a2a;
  touch-action: pan-x;
  -webkit-user-select: none;
  user-select: none;
}
/* 모바일 손가락으로 누르기 편하도록 스크롤바 높이 24px (기존 20px +20%) */
.piano-key-area::-webkit-scrollbar { height: 24px; }
.piano-key-area::-webkit-scrollbar-track { background: #2a2a2a; border-radius: 6px; margin: 0 4px; }
.piano-key-area::-webkit-scrollbar-thumb { background: #888; border-radius: 6px; min-width: 40px; border: 3px solid #2a2a2a; }

#piano-keyboard {
  position: relative;
  display: flex;
  min-width: max-content;
  /* 높이는 흰 건반 height로 결정 */
}

/* ═══════════════════════════════════════
   건반 공통
═══════════════════════════════════════ */
.key {
  position: relative;
  cursor: pointer;
  touch-action: none;
  -webkit-touch-callout: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
}

/* ─── 흰 건반: 가로 +10%(57px), 상단 -10% (전체 225px = 상단 153px + 하단 72px) ─── */
.key.white {
  width: 57px;
  height: 203px;
  background: linear-gradient(180deg, #f4efe7 0%, #ffffff 35%, #eeece4 100%);
  border: 1px solid #c0b8a8;
  border-top: none;
  border-radius: 0 0 7px 7px;
  z-index: 1;
  box-shadow:
    inset -1px 0 0 rgba(0,0,0,0.07),
    0 5px 10px rgba(0,0,0,0.28);
}
.key.white:hover {
  background: linear-gradient(180deg, #e8e3db 0%, #f5f1e9 35%, #e2dfd7 100%);
}

/* ─── 검은 건반: 가로 +10%(37px), 높이 -10%(137px) ─── */
.key.black {
  width: 37px;
  height: 123px;
  background: linear-gradient(180deg, #2c2218 0%, #1a1408 55%, #0e0c04 100%);
  border-radius: 0 0 5px 5px;
  z-index: 2;
  margin: 0 -18px;
  box-shadow:
    2px 5px 10px rgba(0,0,0,0.65),
    inset 0 -2px 4px rgba(255,255,255,0.04);
  padding-bottom: 0;
}
.key.black:hover {
  background: linear-gradient(180deg, #3c2e22 0%, #2a1e10 55%, #180e06 100%);
}

/* 건반 누를 때 */
.key.white.pressed {
  background: linear-gradient(180deg, #d0cec8 0%, #dedad2 100%) !important;
  transform: translateY(2px);
  box-shadow: inset 0 2px 5px rgba(0,0,0,0.22) !important;
}
.key.black.pressed {
  background: linear-gradient(180deg, #1c1610 0%, #0e0c08 100%) !important;
  transform: translateY(2px);
}

/* ═══════════════════════════════════════
   음이름 라벨 (흰 건반 아래, 영어+한글 세로)
═══════════════════════════════════════ */
.note-name-label {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  pointer-events: none;
  padding-bottom: 7px;
  gap: 2px;
  height: 72px;       /* 흰 건반 하단 음이름 영역 */
  width: 100%;
  flex-shrink: 0;
}
.note-eng {
  font-size: 16px;
  font-weight: 900;
  color: #111111;
  line-height: 1.0;
}
.note-kor {
  font-size: 15px;
  font-weight: 900;
  color: #1a1a1a;
  line-height: 1.0;
}
.note-name-label.hidden { visibility: hidden; }

/* ═══════════════════════════════════════
   계이름 뱃지 (원 안에 글씨)
═══════════════════════════════════════ */
.solfege-badge {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  font-family: 'Noto Sans KR', sans-serif;
  font-weight: 900;
  pointer-events: none;
  z-index: 10;
  line-height: 1;
}

/* 흰 건반 뱃지: 검은건반 기준으로 크기·색 통일, 음이름과 겹치지 않게 위치 조정 */
.key.white .solfege-badge {
  width: 33px;
  height: 33px;
  font-size: 17px;
  bottom: 48px;        /* 검은건반 아래끝(123px) 보다 낮은 위치에 배치 */
  left: 50%;
  transform: translateX(-50%);
  background: #e8c030;
  color: #1a0a00;
  border: 2px solid #a07000;
  box-shadow: 0 2px 6px rgba(0,0,0,0.4);
}
.key.white .solfege-badge.tonic {
  background: #2b1a05;
  border-color: #e8c030;
  color: #ffe9a0;
  width: 33px;
  height: 33px;
  font-size: 17px;
  bottom: 48px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.4);
}

/* 검은 건반 뱃지: 기준 크기 */
.key.black .solfege-badge {
  width: 33px;
  height: 33px;
  font-size: 17px;
  bottom: 6px;
  left: 50%;
  transform: translateX(-50%);
  background: #e8c030;
  color: #1a0a00;
  border: 2px solid #a07000;
  box-shadow: 0 2px 5px rgba(0,0,0,0.45);
}
.key.black .solfege-badge.tonic {
  background: #2b1a05;
  border-color: #e8c030;
  color: #ffe9a0;
  box-shadow: 0 2px 5px rgba(0,0,0,0.45);
}

/* 뱃지 숨김 */
.solfege-badge.hidden { display: none; }

/* ═══════════════════════════════════════
   악기 & 볼륨
═══════════════════════════════════════ */
.bottom-controls {
  display: flex;
  gap: 0;
  margin-top: 12px;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  width: 100%;
  padding: 0 8px;
}
.inst-row { display: flex; gap: 6px; align-items: center; }
.inst-btn {
  padding: 7px 10px;
  border-radius: 8px;
  border: 1.5px solid rgba(255,255,255,0.13);
  background: rgba(255,255,255,0.06);
  color: #bbb;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
}
.inst-btn:hover  { background: rgba(255,255,255,0.12); color:#fff; }
.inst-btn.active { background: #b87020; border-color: #e8b040; color:#fff;
                   box-shadow: 0 0 12px rgba(190,120,30,0.5); }

/* 건반 너비 버튼 */
.width-row { display: flex; gap: 6px; align-items: center; }
.width-label { font-size: 14px; font-weight: 700; color: #bbb; letter-spacing: 1px; white-space: nowrap; }
.width-btn {
  padding: 7px 10px;
  border-radius: 8px;
  border: 1.5px solid rgba(255,255,255,0.22);
  background: rgba(255,255,255,0.10);
  color: #ccc;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.width-btn:hover { background: rgba(255,255,255,0.20); color:#fff; }
.width-btn.active {
  background: #2a7a50;
  border-color: #60d090;
  color: #fff;
  box-shadow: 0 0 12px rgba(40,160,90,0.5);
}

/* 넓게 모드: 흰 건반 1.5배(85px), 검은 건반 비례(55px) */
#piano-keyboard.wide .key.white { width: 85px !important; }
#piano-keyboard.wide .key.black { width: 55px !important; margin: 0 -27px !important; }

.volume-row {
  display: flex;
  align-items: center;
  gap: 9px;
}
.vol-label { font-size: 12px; color: #999; letter-spacing:1px; }
input[type=range].vol-slider {
  -webkit-appearance: none;
  width: 80px; height: 6px;
  border-radius: 3px;
  background: rgba(255,255,255,0.15);
  outline: none;
  cursor: pointer;
}
input[type=range].vol-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 17px; height: 17px;
  border-radius: 50%;
  background: #d8b850;
  border: 2px solid #907020;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(0,0,0,0.4);
}

/* 표기 방식 버튼 (숫자/계이름) */
.label-row { display: flex; gap: 6px; align-items: center; }
.label-btn {
  padding: 7px 10px;
  border-radius: 8px;
  border: 1.5px solid rgba(255,255,255,0.22);
  background: rgba(255,255,255,0.10);
  color: #ccc;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.label-btn:hover { background: rgba(255,255,255,0.20); color:#fff; }
.label-btn.active {
  background: #2a5a9a;
  border-color: #60a0e0;
  color: #fff;
  box-shadow: 0 0 12px rgba(40,100,200,0.5);
}

/* ═══════════════════════════════════════
   화음 색칠 (근음 진하게, 나머지 옅게)
   기존 .pressed 규칙보다 뒤에 두어 누르는 동안에도 색을 유지
═══════════════════════════════════════ */
.key[data-chord="1"] { --chord-root: #1550d0; --chord-tone: #a6ccff; }
.key[data-chord="4"] { --chord-root: #0c8a3e; --chord-tone: #a4e8ba; }
.key[data-chord="5"] { --chord-root: #cc1f1f; --chord-tone: #ffb0ac; }

.key.white[data-role="root"], .key.black[data-role="root"] { background: var(--chord-root) !important; }
.key.white[data-role="tone"], .key.black[data-role="tone"] { background: var(--chord-tone) !important; }

/* 검은 건반: 옆 흰 건반과 구분되도록 어두운 테두리 유지 */
.key.black[data-role] {
  box-shadow: inset 0 0 0 2px #14100a, 2px 5px 10px rgba(0,0,0,0.65);
}
.key.white[data-role="root"] .note-eng,
.key.white[data-role="root"] .note-kor { color: #fff; }

.key.white.pressed[data-role], .key.black.pressed[data-role] { filter: brightness(0.8); }

/* ═══════════════════════════════════════
   초보 모드: 켜짐 표시 버튼 + 구성음 외 건반 회색
═══════════════════════════════════════ */
.beginner-btn {
  padding: 11px 24px;
  border-radius: 9px;
  border: 2px solid rgba(255,255,255,0.45);
  background: rgba(255,255,255,0.12);
  color: #dfe8f0;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: box-shadow 0.15s, border-color 0.15s, background 0.15s;
  white-space: nowrap;
}
.beginner-btn:hover  { background: rgba(255,255,255,0.24); }
.beginner-btn:active { transform: translateY(2px); }
.beginner-btn.active {
  background: linear-gradient(135deg, #ffd23f, #f0a800);
  border-color: #fff3b0;
  color: #2a1800;
  box-shadow: 0 0 18px rgba(255,200,40,0.8), inset 0 1px 0 rgba(255,255,255,0.45);
}
.beginner-btn.active::before { content: '✓ '; }

#piano-keyboard.beginner-active .key:not([data-chord]) { cursor: not-allowed; }
#piano-keyboard.beginner-active .key.white:not([data-chord]) { background: #adafb3 !important; }
#piano-keyboard.beginner-active .key.black:not([data-chord]) { background: #6c6f74 !important; }
#piano-keyboard.beginner-active .key:not([data-chord]) .solfege-badge { opacity: 0.45; }

/* 안내 창 둘째 줄: 비어 있으면 숨기고, 켜진 화음의 색으로 표시 */
.lcd-line2:empty { display: none; }
.lcd-line2[data-chord="1"] { color: #1550d0; }
.lcd-line2[data-chord="4"] { color: #0b7a36; }
.lcd-line2[data-chord="5"] { color: #b81818; }

/* 건반이 화면보다 넓을 때 쓰는 음역 이동 버튼 (iOS는 스크롤바를 잡을 수 없음) */
.scroll-nav {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 8px;
}
.scroll-nav[hidden] { display: none; }
.scroll-btn {
  flex: 1;
  min-height: 40px;
  border-radius: 8px;
  border: 1.5px solid rgba(255,255,255,0.35);
  background: rgba(0,0,0,0.25);
  color: #fff;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.scroll-btn:active { filter: brightness(0.8); }

/* 좁은 화면: 줄바꿈된 하단 조작부 간격 */
.bottom-controls { row-gap: 10px; column-gap: 12px; }

</style>
</head>
<body>

<h1>주요 3화음 반주 건반</h1>

<!-- 화음 버튼 -->
<div class="chord-controls">
  <div class="chord-box">
    <button class="chord-btn chord-btn-1" id="btn-chord-1" onclick="selectChord(1)">1도 화음</button>
    <button class="chord-btn chord-btn-4" id="btn-chord-4" onclick="selectChord(4)">4도 화음</button>
    <button class="chord-btn chord-btn-5" id="btn-chord-5" onclick="selectChord(5)">5도 화음</button>
  </div>
  <button class="beginner-btn" id="btn-beginner" aria-pressed="false" onclick="toggleBeginner()">초보</button>
  <button class="reset-btn" onclick="resetAll()">초기화</button>
</div>

<!-- 피아노 프레임 -->
<div class="piano-frame">

  <!-- LCD -->
  <div class="piano-lcd">
    <div class="lcd-text">
      <div class="lcd-line1" id="lcd-line1"></div>
      <div class="lcd-line2" id="lcd-line2"></div>
    </div>
    <div class="lcd-keysig" id="lcd-keysig"></div>
  </div>

  <!-- 음역 이동 (건반이 화면보다 넓을 때만 표시) -->
  <div class="scroll-nav" id="scroll-nav" hidden>
    <button class="scroll-btn" onclick="scrollKeys(-1)">◀ 낮은 음으로</button>
    <button class="scroll-btn" onclick="scrollKeys(1)">높은 음으로 ▶</button>
  </div>

  <!-- 건반 -->
  <div class="piano-key-area" id="piano-key-area">
    <div id="piano-keyboard"></div>
  </div>

  <!-- 악기 & 볼륨 -->
  <div class="bottom-controls">
    <div class="width-row">
      <span class="width-label">너비</span>
      <button class="width-btn active" id="btn-narrow" onclick="setKeyWidth('narrow')">좁게</button>

/* ════════════════════════════════════════════════
   상태
════════════════════════════════════════════════ */
const DEFAULT_TONIC = 'C';
const PROMPT_CHOOSE_KEY = ['현재는 다장조입니다.', '(조를 바꾸고 싶으면 원하는 조의 으뜸음을 눌러주세요.)'];

let tonic             = DEFAULT_TONIC;  // 샵 표기의 건반 이름
let keyConfirmed      = false;          // true면 건반은 연주 전용
let activeChord       = null;           // 1 | 4 | 5 | null
let currentInstrument = 'classic';
let labelMode         = 'solfege';      // 'solfege' | 'number'
let beginnerMode      = false;          // 초기화해도 유지

/* ════════════════════════════════════════════════
   음악 계산
════════════════════════════════════════════════ */
function noteBase(noteName) { return noteName.replace(/[0-9]/g, ''); }
function pitchClass(base)   { return PITCH_CLASSES.indexOf(base); }

// 장음계 degree(0~6)의 올바른 음이름 (예: 사장조 7음 → F♯, 내림사장조 4음 → C♭)
function spellDegree(degree) {
  const letterIdx = (LETTERS.indexOf(MAJOR_KEYS[tonic].letter) + degree) % 7;
  const target    = (pitchClass(tonic) + MAJOR_SCALE[degree]) % 12;
  const diff      = ((target - LETTER_PC[letterIdx] + 18) % 12) - 6;
  const accidental = diff > 0 ? '♯'.repeat(diff) : '♭'.repeat(-diff);
  return LETTERS[letterIdx] + accidental;
}

function degreePitchClass(degree) {
  return (pitchClass(tonic) + MAJOR_SCALE[degree]) % 12;
}

function degreeLabel(degree) {
  return (labelMode === 'number' ? SOLFEGE_NUMBER : SOLFEGE)[degree];
}

function keyTitle() {
  return `${MAJOR_KEYS[tonic].kor}장조(${spellDegree(0)})`;
}

/* ════════════════════════════════════════════════
   화면 갱신
════════════════════════════════════════════════ */
function setLcd(line1, line2 = '') {
  document.getElementById('lcd-line1').textContent = line1;
  document.getElementById('lcd-line2').textContent = line2;
}

function updateKeySigImage() {
  const box = document.getElementById('lcd-keysig');
  box.innerHTML = '';
  const img = document.createElement('img');
  img.src = KEY_SIG_IMAGES[MAJOR_KEYS[tonic].img];
  img.alt = `${keyTitle()} 조표`;
  box.appendChild(img);
}

function clearBadges() {
  document.querySelectorAll('.solfege-badge').forEach(b => {
    b.classList.add('hidden');
    b.classList.remove('tonic');
    b.textContent = '';
  });
}

// 장음계 7음의 계이름(또는 숫자) 뱃지를 모든 옥타브에 표시
function renderBadges() {
  clearBadges();
  if (!keyConfirmed || !labelMode) return;
  const byPc = new Map(MAJOR_SCALE.map((_, d) => [degreePitchClass(d), d]));
  ALL_NOTES.forEach(n => {
    const degree = byPc.get(pitchClass(noteBase(n.name)));
    if (degree === undefined) return;
    const badge = document.getElementById(`badge-${n.name}`);
    badge.textContent = degreeLabel(degree);
    badge.classList.remove('hidden');
    badge.classList.toggle('tonic', degree === 0);
  });
}

// 켜진 화음을 건반 색과 버튼에 반영 (이전 색은 항상 먼저 지움)
function renderChord() {
  document.querySelectorAll('.key[data-chord]').forEach(k => {
    delete k.dataset.chord;
    delete k.dataset.role;
  });
  [1, 4, 5].forEach(c =>
    document.getElementById(`btn-chord-${c}`).classList.toggle('active', c === activeChord));
  keyboard.classList.toggle('beginner-active', beginnerMode && activeChord !== null);
  if (!activeChord) return;

  const degrees = CHORD_DEGREES[activeChord];
  const rootPc  = degreePitchClass(degrees[0]);
  const chordPcs = degrees.map(degreePitchClass);
  ALL_NOTES.forEach(n => {
    const pc = pitchClass(noteBase(n.name));
    if (!chordPcs.includes(pc)) return;
    const keyEl = document.getElementById(`key-${n.name}`);
    keyEl.dataset.chord = activeChord;
    keyEl.dataset.role  = (pc === rootPc) ? 'root' : 'tone';
  });
  silenceMutedKeys();
}

// 초보 모드에서 화음이 켜져 있으면 색이 없는(회색) 건반은 소리를 내지 않음
function isMuted(noteName) {
  return beginnerMode && activeChord !== null
      && !document.getElementById(`key-${noteName}`).dataset.chord;
}

// 누르고 있던 건반이 화음 변경으로 회색이 되면 바로 멈춤
function silenceMutedKeys() {
  keyboard.querySelectorAll('.key.pressed').forEach(k => {
    const noteName = k.id.replace('key-', '');
    if (!isMuted(noteName)) return;
    stopNote(noteName);
    k.classList.remove('pressed');
  });
}

function toggleBeginner() {
  beginnerMode = !beginnerMode;
  const btn = document.getElementById('btn-beginner');
  btn.classList.toggle('active', beginnerMode);
  btn.setAttribute('aria-pressed', String(beginnerMode));
  renderChord();
}

function renderLcd() {
  const line2 = document.getElementById('lcd-line2');
  if (!keyConfirmed) {
    setLcd(...PROMPT_CHOOSE_KEY);
    delete line2.dataset.chord;
    return;
  }
  let chordText = '';
  if (activeChord) {
    const degrees = CHORD_DEGREES[activeChord];
    const labels  = (labelMode === 'number')
      ? degrees.map(d => `${SOLFEGE_NUMBER[d]}음`).join(', ')
      : degrees.map(degreeLabel).join(' ');
    const spelled = degrees.map(spellDegree).join(' ');
    chordText = `${activeChord}도 화음: ${labels} (${spelled})`;
    line2.dataset.chord = activeChord;
  } else {
    delete line2.dataset.chord;
  }
  setLcd(`${keyTitle()}입니다. 1도·4도·5도 버튼을 눌러 보세요`, chordText);
}

function renderAll() {
  updateKeySigImage();
  renderBadges();
  renderChord();
  renderLcd();
}

/* ════════════════════════════════════════════════
   조 선택 · 화음 버튼 · 초기화
════════════════════════════════════════════════ */
function confirmKey(base) {
  tonic = base;
  keyConfirmed = true;
  renderAll();
}

// 화음 버튼은 색만 칠하고 소리는 내지 않음.
// 조를 고르기 전에 누르면 기본값인 다장조로 확정.
function selectChord(chord) {
  keyConfirmed = true;
  activeChord  = chord;
  renderAll();
}

function resetAll() {
  tonic        = DEFAULT_TONIC;
  keyConfirmed = false;
  activeChord  = null;
  renderAll();

  document.querySelectorAll('.note-name-label').forEach(el => {
    el.classList.add('hidden');
    el.querySelector('.note-eng').style.display = '';
    el.querySelector('.note-kor').style.display = '';
  });
  document.getElementById('btn-notename').classList.remove('active');
  noteNameMode = 0;
}

/* ════════════════════════════════════════════════
   오디오 엔진 (CLAUDE.md 1·2절)
   사용자 제스처 안에서만 AudioContext를 생성한다.
════════════════════════════════════════════════ */
const VOICE_PEAK  = 0.133;  // 세 음이 합쳐져도 찌그러지지 않도록 단음(0.4)의 1/3
const VOLUME_GAIN = 2.0;    // 음별 게인을 낮춘 만큼 슬라이더 쪽에서 보상

let audioCtx       = null;
let masterGain     = null;
let silentBufDone  = false;

function sliderGain() {
  return parseFloat(document.getElementById('vol-ctrl').value) * VOLUME_GAIN;
}

function ensureAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = sliderGain();

  // 손가락을 많이 짚거나 볼륨이 최대일 때의 클리핑을 막는 리미터
  const limiter = audioCtx.createDynamicsCompressor();
  limiter.threshold.value = -8;
  limiter.knee.value      = 6;
  limiter.ratio.value     = 12;
  limiter.attack.value    = 0.003;
  limiter.release.value   = 0.15;
  masterGain.connect(limiter);
  limiter.connect(audioCtx.destination);
}

// 건반·버튼 제스처 핸들러의 첫 줄에서 호출
function unlockAudio() {
  ensureAudio();
  if (audioCtx.state !== 'running') audioCtx.resume();
  else if (silentBufDone) return;
  try {
    const buf = audioCtx.createBuffer(1, 1, 22050);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.connect(audioCtx.destination);
    src.start(0);
    silentBufDone = true;
  } catch (e) {}
}

const activeVoices   = {};
const activePointers = new Map();   // pointerId → 음 이름

function isHeld(noteName) {
  return [...activePointers.values()].includes(noteName);
}

const instPresets = {
  classic:  { attack: 0.005, release: 1.5 },
  electric: { attack: 0.010, release: 0.6 },
};

async function playNote(noteName) {
  ensureAudio();
  if (audioCtx.state !== 'running') await audioCtx.resume();
  // resume을 기다리는 사이 손가락을 뗐거나 건반이 회색이 됐다면 재생하지 않음 (멈추지 않는 음 방지)
  if (!isHeld(noteName) || isMuted(noteName)) return;
  if (activeVoices[noteName]) stopNote(noteName);

  const note = ALL_NOTES.find(n => n.name === noteName);
  if (!note) return;

  const now  = audioCtx.currentTime;
  const p    = instPresets[currentInstrument];
  const gain = audioCtx.createGain();
  const filt = audioCtx.createBiquadFilter();
  const oscs = [];
  const extra = [];   // 소리가 끝난 뒤 함께 끊을 보조 게인

  if (currentInstrument === 'classic') {
    const o1 = audioCtx.createOscillator(); o1.type = 'triangle';
    o1.frequency.setValueAtTime(note.freq, now);
    const o2 = audioCtx.createOscillator(); o2.type = 'sine';
    o2.frequency.setValueAtTime(note.freq * 2, now);
    const g2 = audioCtx.createGain(); g2.gain.setValueAtTime(0.18, now);
    const hm = audioCtx.createOscillator(); hm.type = 'sine';
    hm.frequency.setValueAtTime(note.freq * 3, now);
    const hg = audioCtx.createGain();
    hg.gain.setValueAtTime(0.55, now);
    hg.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);
    o1.connect(filt); o2.connect(g2).connect(filt); hm.connect(hg).connect(filt);
    oscs.push(o1, o2, hm); extra.push(g2, hg);
    filt.type = 'lowpass';
    filt.frequency.setValueAtTime(4000, now);
    filt.frequency.exponentialRampToValueAtTime(800, now + 2.0);
    gain.gain.exponentialRampToValueAtTime(VOICE_PEAK * 0.025, now + 4);
  } else {
    const body = audioCtx.createOscillator(); body.type = 'sine';
    body.frequency.setValueAtTime(note.freq, now);
    const tine = audioCtx.createOscillator(); tine.type = 'sine';
    tine.frequency.setValueAtTime(note.freq * 4, now);
    const tg = audioCtx.createGain();
    tg.gain.setValueAtTime(0.28, now);
    tg.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
    body.connect(filt); tine.connect(tg).connect(filt);
    oscs.push(body, tine); extra.push(tg);
    filt.type = 'lowpass'; filt.frequency.setValueAtTime(2500, now);
    gain.gain.exponentialRampToValueAtTime(VOICE_PEAK * 0.025, now + 5);
  }

  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.linearRampToValueAtTime(VOICE_PEAK, now + p.attack);
  filt.connect(gain).connect(masterGain);
  oscs.forEach(o => o.start(now));

  // 음이 끝나면 노드를 끊어 반복 연주 중 쌓이지 않게 함
  oscs[0].onended = () => {
    [...oscs, ...extra, filt, gain].forEach(n => { try { n.disconnect(); } catch (e) {} });
  };
  activeVoices[noteName] = { oscs, gain };
}

function stopNote(noteName) {
  const v = activeVoices[noteName];
  if (!v) return;
  const now = audioCtx.currentTime;
  const rel = instPresets[currentInstrument].release;
  const safe = Math.max(v.gain.gain.value, 0.0001);
  v.gain.gain.cancelScheduledValues(now);
  v.gain.gain.setValueAtTime(safe, now);
  v.gain.gain.exponentialRampToValueAtTime(0.0001, now + rel);
  v.oscs.forEach(o => { try { o.stop(now + rel + 0.1); } catch (e) {} });
  delete activeVoices[noteName];
}

/* ════════════════════════════════════════════════
   포인터 이벤트 — 손가락별로 음을 관리 (멀티터치 + 글리산도)
   글리산도는 Scale_Master_v2.6.html의 pointermove 방식을 그대로 사용. 지우지 말 것.
════════════════════════════════════════════════ */
window.addEventListener('pointerdown', async e => {
  unlockAudio();   // 반드시 첫 줄
  const keyEl = e.target.closest ? e.target.closest('.key') : null;
  if (!keyEl || e.button !== 0) return;   // 건반이 아니면(스크롤바 등) 무시
  e.preventDefault();

  const noteName = keyEl.id.replace('key-', '');
  if (!keyConfirmed) confirmKey(noteBase(noteName));

  activePointers.set(e.pointerId, noteName);
  // setPointerCapture 대신 releasePointerCapture로 포인터를 자유롭게 풀어
  // → pointermove 시 elementFromPoint 추적이 정확하게 작동
  try { keyEl.setPointerCapture(e.pointerId); } catch (err) {}
  try { keyEl.releasePointerCapture(e.pointerId); } catch (err) {}
  await pressKey(keyEl, noteName);
}, { passive: false });

// 회색 건반은 눌린 표시도 소리도 없음. 포인터 추적은 유지되어 글리산도로 색 건반에 들어가면 소리가 남.
async function pressKey(keyEl, noteName) {
  if (isMuted(noteName)) return;
  keyEl.classList.add('pressed');
  await playNote(noteName);
}

window.addEventListener('pointermove', e => {
  if (!activePointers.has(e.pointerId)) return;
  const el    = document.elementFromPoint(e.clientX, e.clientY);
  const keyEl = el ? el.closest('.key') : null;
  if (keyEl) {
    const nname = keyEl.id.replace('key-', '');
    const prev  = activePointers.get(e.pointerId);
    if (prev !== nname) {
      activePointers.set(e.pointerId, nname);
      if (prev) silenceIfFree(prev);
      pressKey(keyEl, nname);
    }
  } else {
    // 건반 밖(스크롤바, 여백 등)으로 나가면 소리 정지, 포인터 추적 유지
    const prev = activePointers.get(e.pointerId);
    if (prev) { activePointers.set(e.pointerId, null); silenceIfFree(prev); }
  }
}, { passive: true });   // passive:true → 스크롤바 터치 이동 원활하게

// 다른 손가락이 같은 건반을 누르고 있지 않을 때만 음을 멈춤
function silenceIfFree(noteName) {
  if (isHeld(noteName)) return;
  stopNote(noteName);
  document.getElementById(`key-${noteName}`)?.classList.remove('pressed');
}

function releasePointer(pointerId) {
  if (!activePointers.has(pointerId)) return;
  const noteName = activePointers.get(pointerId);
  activePointers.delete(pointerId);
  if (noteName) silenceIfFree(noteName);   // 건반 밖에서 뗀 경우 null
}

['pointerup', 'pointercancel'].forEach(evt => {
  window.addEventListener(evt, e => releasePointer(e.pointerId));
});

// 일부 브라우저는 터치의 pointerdown을 오디오 허용 제스처로 치지 않으므로 뗄 때도 잠금 해제
window.addEventListener('pointerup', unlockAudio);
window.addEventListener('touchend', unlockAudio, { passive: true });

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    [...activePointers.keys()].forEach(releasePointer);
  } else if (audioCtx && audioCtx.state !== 'running') {
    audioCtx.resume();
  }
});

/* ════════════════════════════════════════════════
   건반 렌더링 (25건반 고정)
════════════════════════════════════════════════ */
function renderKeyboard() {
  const container = document.getElementById('piano-keyboard');
  container.innerHTML = '';

  ALL_NOTES.forEach(note => {
    const keyEl = document.createElement('div');
    keyEl.className = `key ${note.type}`;
    keyEl.id = `key-${note.name}`;

    if (note.type === 'white') {
      const eng = noteBase(note.name);
      const lbl = document.createElement('div');
      lbl.className = 'note-name-label hidden';
      lbl.innerHTML =
        `<span class="note-eng">${eng}</span>` +
        `<span class="note-kor">${NOTE_KOR[eng]}</span>`;
      keyEl.appendChild(lbl);
    }

    const badge = document.createElement('div');
    badge.className = 'solfege-badge hidden';
    badge.id = `badge-${note.name}`;
    keyEl.appendChild(badge);

    container.appendChild(keyEl);
  });
}

/* ════════════════════════════════════════════════
   표시 · 음색 · 너비 · 볼륨
════════════════════════════════════════════════ */
let noteNameMode = 0;   // 0: 숨김, 1: 한글, 2: 영문, 3: 둘 다
function toggleNoteName() {
  noteNameMode = (noteNameMode + 1) % 4;
  document.getElementById('btn-notename').classList.toggle('active', noteNameMode !== 0);
  document.querySelectorAll('.note-name-label').forEach(el => {
    el.classList.toggle('hidden', noteNameMode === 0);
    if (noteNameMode === 0) return;
    el.querySelector('.note-eng').style.display = (noteNameMode === 1) ? 'none' : '';
    el.querySelector('.note-kor').style.display = (noteNameMode === 2) ? 'none' : '';
  });
}

// 같은 버튼을 다시 누르면 꺼짐. 뱃지에는 한 가지만 표시되므로 다른 버튼을 누르면 그쪽으로 전환.
function toggleLabelMode(mode) {
  labelMode = (labelMode === mode) ? null : mode;
  document.getElementById('btn-label-num').classList.toggle('active', labelMode === 'number');
  document.getElementById('btn-label-solfege').classList.toggle('active', labelMode === 'solfege');
  renderBadges();
  renderLcd();
}

function setInstrument(inst) {
  currentInstrument = inst;
  document.querySelectorAll('.inst-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`inst-${inst}`).classList.add('active');
}

function setKeyWidth(mode) {
  document.getElementById('piano-keyboard').classList.toggle('wide', mode === 'wide');
  document.querySelectorAll('.width-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`btn-${mode}`).classList.add('active');
  updateScrollNav();
}

document.getElementById('vol-ctrl').oninput = () => {
  ensureAudio();
  masterGain.gain.setTargetAtTime(sliderGain(), audioCtx.currentTime, 0.05);
};

/* ════════════════════════════════════════════════
   가로 스크롤 · 터치 (CLAUDE.md 3·4절)
════════════════════════════════════════════════ */
const keyArea  = document.getElementById('piano-key-area');
const keyboard = document.getElementById('piano-keyboard');
const SCROLLBAR_BAND = 28;

function updateScrollNav() {
  document.getElementById('scroll-nav').hidden =
    keyArea.scrollWidth <= keyArea.clientWidth + 1;
}

function scrollKeys(direction) {
  const octave = keyboard.querySelector('.key.white').offsetWidth * 7;
  keyArea.scrollBy({ left: direction * octave, behavior: 'smooth' });
}

keyboard.addEventListener('touchstart', e => {
  unlockAudio();
  e.preventDefault();
}, { passive: false });

keyboard.addEventListener('touchmove', e => {
  const limit = keyArea.getBoundingClientRect().bottom - SCROLLBAR_BAND;
  // 모든 손가락이 스크롤바 영역에 있을 때만 브라우저 스크롤에 맡김
  if ([...e.targetTouches].every(t => t.clientY > limit)) return;
  e.preventDefault();
}, { passive: false });

/* ════════════════════════════════════════════════
   초기 실행
════════════════════════════════════════════════ */
renderKeyboard();
renderAll();
updateScrollNav();
window.addEventListener('resize', updateScrollNav);
if (window.ResizeObserver) new ResizeObserver(updateScrollNav).observe(keyArea);
</script>
</body>
</html>
